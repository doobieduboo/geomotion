<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1215" />
    <title>GeoMotion — Media Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0b1215;
        color: #edf3ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 960px;
        margin: auto;
        padding: 28px 20px 48px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }
      .brand {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.6px;
      }
      .brand span {
        color: #96d6bf;
      }
      .badge {
        border: 1px solid #30443c;
        color: #bdd2c8;
        padding: 6px 10px;
        border-radius: 30px;
        font-size: 11px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(250px, 360px) 1fr;
        gap: 42px;
        align-items: center;
      }
      .player {
        background: #000;
        border: 1px solid #2b3b37;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 70px #0007;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 9/16;
        background: #000;
      }
      .video-stage {
        position: relative;
        isolation: isolate;
        background: #000;
      }
      .video-stage:fullscreen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .video-stage:fullscreen video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      video::-webkit-media-controls-overlay-play-button {
        display: none !important;
      }
      .tap-toggle {
        position: absolute;
        inset: 0 0 104px;
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .video-controls {
        position: absolute;
        inset: auto 0 0;
        padding: 12px 12px max(4px, env(safe-area-inset-bottom));
        color: #fff;
        background: linear-gradient(transparent, #000b 38%, #000e);
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
      }
      .control-button {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .control-button svg { width: 20px; height: 20px; fill: currentColor; }
      .time-display {
        flex: 1;
        white-space: nowrap;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .timeline {
        --progress: 0%;
        display: block;
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 44px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }
      .timeline::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(to right, #b3e8d2 var(--progress), #ffffff60 var(--progress));
      }
      .timeline::-moz-range-track { height: 4px; border-radius: 4px; background: #ffffff60; }
      .timeline::-moz-range-progress { height: 4px; border-radius: 4px; background: #b3e8d2; }
      .timeline::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 5px #0008;
      }
      .timeline::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
      button:focus-visible, .timeline:focus-visible {
        outline: 2px solid #b3e8d2;
        outline-offset: -2px;
      }
      h1 {
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1.08;
        letter-spacing: -1.4px;
        margin: 12px 0 15px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #96d6bf;
        font-weight: 700;
      }
      .muted {
        color: #a8b7b0;
        font-size: 14px;
        line-height: 1.65;
      }
      .meta {
        font-size: 13px;
        color: #becdc5;
        margin: 20px 0 28px;
      }
      label {
        font-size: 12px;
        color: #becdc5;
        display: block;
        margin-bottom: 9px;
      }
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #3c5047;
        border-radius: 10px;
        background: #14201b;
        color: #edf3ef;
        font-size: 14px;
        margin-bottom: 16px;
      }
      a.button {
        font: inherit;
        width: 100%;
        cursor: pointer;
        display: block;
        text-align: center;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #3c5047;
        text-decoration: none;
        color: #edf3ef;
        background: transparent;
        font-weight: 650;
        font-size: 14px;
        margin: 10px 0;
      }
      a.primary {
        background: #b3e8d2;
        color: #0c2017;
        border-color: transparent;
      }
      small {
        font-size: 12px;
        color: #93a89d;
      }
      #error {
        color: #ffb9a5;
        background: #321e18;
        padding: 12px;
        border-radius: 10px;
        font-size: 13px;
      }
      footer {
        margin-top: 32px;
        font-size: 11px;
        color: #8da197;
      }
      footer a {
        color: inherit;
      }
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #b3e8d2;
        outline-offset: 3px;
      }
      @media (max-width: 650px) {
        main {
          padding: 18px 18px 32px;
        }
        header {
          margin-bottom: 22px;
        }
        .layout {
          display: flex;
          flex-direction: column;
          gap: 24px;
          align-items: stretch;
        }
        .player {
          width: min(100%, 320px);
          margin: auto;
        }
        .info {
          max-width: 420px;
          width: 100%;
          margin: auto;
        }
        h1 {
          font-size: 33px;
        }
        .meta {
          margin: 14px 0 20px;
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">GEO<span>MOTION</span></div>
        <span class="badge" id="stage">Memuat video…</span>
      </header>
      <div class="layout">
        <section class="player" aria-label="Pemutar video GeoMotion">
          <div class="video-stage" id="video-stage">
            <video id="video" controls playsinline preload="none">
              Browser ini tidak mendukung video. Gunakan tombol download.
            </video>
            <button id="tap-toggle" class="tap-toggle" type="button" aria-label="Putar video" aria-controls="video" hidden></button>
            <div id="video-controls" class="video-controls" role="group" aria-label="Kontrol video" hidden>
              <div class="control-row">
                <button id="play-toggle" class="control-button" type="button" aria-label="Putar video" aria-controls="video">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
                </button>
                <span class="time-display"><span id="current-time">0:00</span> / <span id="total-time">0:00</span></span>
                <button id="mute-toggle" class="control-button" type="button" aria-label="Bisukan audio" aria-controls="video">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path id="mute-icon" d="M3 9v6h4l5 4V5L7 9zm12-2v2a4 4 0 010 6v2a6 6 0 000-10z"/></svg>
                </button>
                <button id="fullscreen-toggle" class="control-button" type="button" aria-label="Layar penuh">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg>
                </button>
              </div>
              <input id="timeline" class="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Posisi pemutaran video" aria-controls="video" disabled />
            </div>
          </div>
        </section>
        <section class="info">
          <div class="eyebrow" id="eyebrow">GEOMOTION / VIDEO</div>
          <h1 id="title">Video GeoMotion</h1>
          <p class="muted" id="description"></p>
          <div class="meta" id="meta"></div>
          <div id="error" role="alert" hidden></div>
          <label for="quality">Kualitas video</label
          ><select id="quality" disabled></select
          ><a id="download" class="button primary" hidden>Download video</a
          ><small id="hint"></small>
        </section>
      </div>
      <footer>
        GeoMotion · <a id="credits" href="credits.md">Sumber & kredit media</a>
      </footer>
    </main>
    <script src="app.js?v=2"></script>
  </body>
</html>
