name: GeoMotion tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r .agents/skills/geomotion/scripts/requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Player regression tests
        run: node --test tests/player.test.cjs
